name: AddressSanitizer and UndefinedBehaviorSanitizer

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: Ubuntu x86_64, Clang, Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure C++17 sanitizer build
        run: |
          cmake -B build-san -S . \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NATIVE_SIMD=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build all targets with sanitizers
        run: cmake --build build-san --parallel

      - name: Run CTest under ASan and UBSan
        run: python3 .github/scripts/run_ctest.py build-san Debug

      - name: Exercise the benchmark under sanitizers
        working-directory: build-san
        run: ./solver_benchmark --quick > benchmark-smoke.log 2>&1
