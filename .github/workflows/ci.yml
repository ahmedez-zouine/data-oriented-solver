name: Build & CTest

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64 — GCC (Release)
            os: ubuntu-latest
            cxx: g++
            build_type: Release
          - name: Ubuntu x86_64 — GCC (Debug)
            os: ubuntu-latest
            cxx: g++
            build_type: Debug
          - name: Ubuntu x86_64 — Clang (Release)
            os: ubuntu-latest
            cxx: clang++
            build_type: Release
          - name: macOS ARM64 — AppleClang (Release)
            os: macos-latest
            cxx: clang++
            build_type: Release
          - name: Windows x64 — MSVC (Release)
            os: windows-latest
            cxx: cl
            build_type: Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            cmake -B build -S . -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run CTest (36 tests)
        shell: bash
        run: |
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure | tee ctest_output.txt

      - name: Publish CTest Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }} — CTest Results"
            echo '```text'
            tail -n 10 ctest_output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
