name: Build and CTest

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctest:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64, GCC, Release
            os: ubuntu-latest
            cxx: g++
            build_type: Release
          - name: Ubuntu x86_64, GCC, Debug
            os: ubuntu-latest
            cxx: g++
            build_type: Debug
          - name: Ubuntu x86_64, Clang, Release
            os: ubuntu-latest
            cxx: clang++
            build_type: Release
          - name: macOS ARM64, AppleClang, Release
            os: macos-latest
            cxx: clang++
            build_type: Release
          - name: Windows x64, MSVC, Release
            os: windows-latest
            cxx: cl
            build_type: Release

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure C++17 build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            cmake -B build -S . \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build all targets
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run CTest and verify required cases
        id: ctest
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --output-junit ctest-results.xml

      - name: Verify required test results
        if: ${{ !cancelled() && steps.ctest.outcome != 'skipped' }}
        run: python .github/scripts/check_ctest_report.py build/ctest-results.xml
