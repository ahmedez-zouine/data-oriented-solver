name: Benchmarks (macOS ARM64 & Ubuntu)

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 (Apple Clang)
            os: macos-latest
            cxx: clang++
            vec_flag: "-Rpass=loop-vectorize"
            artifact_name: results-macos-arm64-appleclang
          - name: Ubuntu x86_64 (GCC)
            os: ubuntu-latest
            cxx: g++
            vec_flag: "-fopt-info-vec-optimized"
            artifact_name: results-ubuntu-x86_64-gcc
          - name: Ubuntu x86_64 (Clang)
            os: ubuntu-latest
            cxx: clang++
            vec_flag: "-Rpass=loop-vectorize"
            artifact_name: results-ubuntu-x86_64-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release + Vectorization Diagnostics)
        run: |
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.vec_flag }}"

      - name: Build & Capture Compiler Vectorization Report
        run: |
          cmake --build build --parallel 2>&1 | tee build/vectorization_report.txt

      - name: Run Benchmark Suite (--quick)
        run: |
          cd build
          if [ "${{ runner.os }}" = "macOS" ] && [ -f ../tools/benchmark_macos.sh ]; then
            sh ../tools/benchmark_macos.sh ./solver_benchmark --quick | tee benchmark_output.txt
          else
            ./solver_benchmark --quick | tee benchmark_output.txt
          fi
          ./solver_benchmark --suite grid2d --quick | tee -a benchmark_output.txt

      - name: Publish Benchmark Results to Job Summary
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo ""
            echo "### Benchmark Output"
            echo '```text'
            cat build/benchmark_output.txt
            echo '```'
            echo ""
            echo "### Platform Profile"
            echo '```json'
            cat build/platform_profile.json || true
            echo '```'
            echo ""
            echo "### Vectorized Loops Sample"
            echo '```text'
            grep -i "vectorized" build/vectorization_report.txt | head -n 20 || echo "No vectorization remarks captured."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Benchmark & Vectorization Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/benchmark_output.txt
            build/vectorization_report.txt
            build/*.csv
            build/platform_profile.json
          if-no-files-found: ignore
