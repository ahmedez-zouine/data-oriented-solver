name: Benchmark Smoke Checks

on:
  push:
    branches: [Master, main]
  pull_request:
    branches: [Master, main]
  workflow_dispatch:

# This workflow checks that benchmark commands run. It never publishes their output.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64, AppleClang
            os: macos-latest
            cxx: clang++
            vec_flag: "-Rpass=loop-vectorize"
          - name: Ubuntu x86_64, GCC
            os: ubuntu-latest
            cxx: g++
            vec_flag: "-fopt-info-vec-optimized"
          - name: Ubuntu x86_64, Clang
            os: ubuntu-latest
            cxx: clang++
            vec_flag: "-Rpass=loop-vectorize"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure optimized C++17 build
        run: |
          cmake -B build -S . \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.vec_flag }}"

      - name: Build benchmark and capture local diagnostics
        run: cmake --build build --target solver_benchmark --parallel > build/compiler-diagnostics.log 2>&1

      - name: Run quick benchmark smoke checks
        run: |
          set -euo pipefail
          cd build
          if [[ "${{ runner.os }}" == "macOS" && -f ../tools/benchmark_macos.sh ]]; then
            sh ../tools/benchmark_macos.sh ./solver_benchmark --quick > benchmark-smoke.log 2>&1
          else
            ./solver_benchmark --quick > benchmark-smoke.log 2>&1
          fi
          for table in benchmark_results.csv jacobi_2d.csv dsl_benchmark.csv multicore_benchmark.csv; do
            if ! awk 'END {exit (NR < 2)}' "$table"; then
              echo "Missing header or data row in $table"
              exit 1
            fi
          done
          python3 -c 'import json; assert json.load(open("platform_profile.json"))["cpu_arch"]'

      - name: Write benchmark summary
        run: |
          echo "Quick run completed with 4 result tables and 1 hardware profile." >> "$GITHUB_STEP_SUMMARY"
