# SonarCloud project identity. Create this project in the ahmedez-zouine organization.
sonar.organization=ahmedez-zouine
sonar.projectKey=ahmedez-zouine_data-oriented-solver
sonar.projectName=Data-Oriented C++17 Scientific Solver

# Keep analysis scoped to maintained C++ sources and the test suite.
sonar.sources=include,src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.cfamily.compile-commands=build/sonar/compile_commands.json
sonar.coverageReportPaths=build/sonar/coverage.xml
sonar.python.coverage.reportPaths=build/sonar/python-coverage.xml

# Wait for the server-side quality gate so the workflow reports its result.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
